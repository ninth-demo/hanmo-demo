<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>施工案例｜漢膜車體美研（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="cases.html">
<header id="site-head"></header>

<main>
  <div class="page-head">
    <div class="wrap">
      <span class="tape-mark" aria-hidden="true"></span>
      <h1>施工案例</h1>
      <p>每一台車的車況和需求都不一樣。這裡記錄我們怎麼判斷、怎麼施工。</p>
    </div>
  </div>
  <section class="sec" style="padding-top:40px">
    <div class="wrap"><ul class="case-list" id="cases"></ul></div>
  </section>
</main>

<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var list = HM.sortedCases(HM.Store.load());
  document.getElementById("cases").innerHTML = list.length ? list.map(function (c) {
    return '<li><a href="case.html?id=' + encodeURIComponent(c.id) + '"><time datetime="' + c.date + '">' + c.date.slice(0, 7).replace("-", ".") + '</time>' +
      "<div><h3>" + HM.esc(c.title) + '</h3><p class="car-name">' + HM.esc([c.car, c.color].filter(Boolean).join("，")) + "</p></div>" +
      '<div class="chips">' + c.items.map(function (i) { return "<span>" + HM.esc(i) + "</span>"; }).join("") + "</div></a></li>";
  }).join("") : '<li class="muted" style="padding:28px 0">還沒有施工案例。</li>';
})();
</script>
</body>
</html>
