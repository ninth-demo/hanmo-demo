<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>預約諮詢｜漢膜車體美研（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="visit.html">
<header id="site-head"></header>

<main>
  <div class="page-head">
    <div class="wrap">
      <span class="tape-mark" aria-hidden="true"></span>
      <h1>預約諮詢</h1>
      <p>採預約制。填好下面的表單，老闆看過您的用車習慣後，會打電話跟您約時間。</p>
    </div>
  </div>

  <section class="sec" style="padding-top:56px">
    <div class="wrap visit-grid">
      <div class="card">
        <h2>預約單</h2>
        <form class="form" id="book-form" novalidate>
          <div class="row2">
            <div class="field"><label for="car">車款</label><input id="car" name="car" placeholder="例如：Toyota RAV4" required></div>
            <div class="field"><label for="color">車色</label><input id="color" name="color" placeholder="例如：珍珠白"></div>
          </div>
          <fieldset class="field">
            <legend>車子平常停在哪裡？</legend>
            <div class="choices">
              <label><input type="radio" name="park" value="室內車庫" checked><span>室內車庫</span></label>
              <label><input type="radio" name="park" value="室外" ><span>室外</span></label>
              <label><input type="radio" name="park" value="兩種都有"><span>兩種都有</span></label>
            </div>
          </fieldset>
          <fieldset class="field">
            <legend>多久開一次？</legend>
            <div class="choices">
              <label><input type="radio" name="freq" value="每天開" checked><span>每天開</span></label>
              <label><input type="radio" name="freq" value="一週幾次"><span>一週幾次</span></label>
              <label><input type="radio" name="freq" value="假日才開"><span>假日才開</span></label>
            </div>
          </fieldset>
          <fieldset class="field">
            <legend>想做的項目（可複選，不確定可以不選）</legend>
            <div class="choices" id="items"></div>
          </fieldset>
          <div class="row2">
            <div class="field"><label for="date">希望到店日期</label><input id="date" name="date" type="date" required></div>
            <div class="field"><label for="slot">時段</label>
              <select id="slot" name="slot"><option>上午</option><option>下午</option><option>傍晚</option></select>
            </div>
          </div>
          <p class="err" id="closed-msg" role="alert"></p>
          <div class="row2">
            <div class="field"><label for="name">您的稱呼</label><input id="name" name="name" placeholder="例如：陳先生" required></div>
            <div class="field"><label for="phone">手機號碼</label><input id="phone" name="phone" type="tel" inputmode="tel" placeholder="0912345678" required></div>
          </div>
          <div class="field"><label for="memo">想跟老闆說的話（選填）</label><textarea id="memo" name="memo" rows="3" placeholder="例如：漆面有明顯刮痕、想了解分期"></textarea></div>
          <p class="err" id="form-error"></p>
          <button class="btn btn-ink" type="submit">送出預約</button>
          <p class="toast" id="toast" role="status"></p>
        </form>
      </div>

      <div>
        <div class="card">
          <h2>想直接問？</h2>
          <p class="muted" style="margin-bottom:16px">傳幾張車子的照片到 LINE，回覆最快。</p>
          <p style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn btn-line" id="line-btn" target="_blank" rel="noopener">加 LINE</a><a class="btn btn-ghost" href="tel:0229016188">02-2901-6188</a></p>
        </div>
        <div class="card">
          <h2>營業時間</h2>
          <p class="status" id="status"><i></i><span></span></p>
          <table class="hours" id="hours" style="margin-top:10px"></table>
          <p class="hint" style="margin-top:10px">採預約制，請先預約再到店。</p>
        </div>
        <div class="card">
          <h2>地址</h2>
          <ul class="contact-list">
            <li>新北市新莊區中正路 887 之 5 號</li>
            <li>可刷卡分期</li>
          </ul>
          <iframe class="map" title="漢膜車體美研地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=%E6%96%B0%E5%8C%97%E5%B8%82%E6%96%B0%E8%8E%8A%E5%8D%80%E4%B8%AD%E6%AD%A3%E8%B7%AF887%E4%B9%8B5%E8%99%9F&output=embed"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var data = HM.Store.load(), now = HM.taipeiNow();
  var lb = document.getElementById("line-btn"); lb.href = SHOP.line; lb.insertAdjacentHTML("afterbegin", LINE_ICON);

  var st = HM.statusFor(data), s = document.getElementById("status");
  s.classList.toggle("closed", !st.open); s.querySelector("span").textContent = st.text;
  document.getElementById("hours").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(function (d) {
    var h = data.hours[d];
    return '<tr class="' + (d === now.day ? "today" : "") + '"><td>' + HM.WEEK[d] + "</td><td" + (h ? "" : ' class="off"') + ">" + (h ? h[0] + "～" + h[1] : "店休") + "</td></tr>";
  }).join("");

  document.getElementById("items").innerHTML = data.prices.map(function (p) {
    return '<label><input type="checkbox" name="items" value="' + HM.esc(p.name) + '"><span>' + HM.esc(p.name) + "</span></label>";
  }).join("");

  var dateEl = document.getElementById("date"), msg = document.getElementById("closed-msg");
  // 最早可預約明天
  var t = new Date(now.date + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + 1);
  dateEl.min = t.toISOString().slice(0, 10);
  function check() {
    var d = dateEl.value; msg.textContent = "";
    if (!d) return true;
    var day = new Date(d + "T00:00:00Z").getUTCDay();
    var c = data.closures.filter(function (x) { return x.date === d; })[0];
    if (c) { msg.textContent = d.replace(/-/g, "/") + " 店休" + (c.reason ? "（" + c.reason + "）" : "") + "，請選其他日期。"; return false; }
    if (!data.hours[day]) { msg.textContent = HM.WEEK[day] + "店休，請選其他日期。"; return false; }
    return true;
  }
  dateEl.addEventListener("change", check);

  document.getElementById("book-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, err = document.getElementById("form-error");
    var phone = f.phone.value.replace(/\D/g, "");
    if (!f.car.value.trim()) { err.textContent = "請填寫車款，老闆才能先估價。"; return; }
    if (!f.date.value) { err.textContent = "請選希望到店的日期。"; return; }
    if (f.date.value < dateEl.min) { err.textContent = "最早可以預約明天。"; return; }
    if (!check()) { err.textContent = "這天店休，請換一個日期。"; return; }
    if (!f.name.value.trim()) { err.textContent = "請填寫您的稱呼。"; return; }
    if (!/^09\d{8}$/.test(phone)) { err.textContent = "手機號碼格式不對，請輸入 09 開頭的 10 位數字。"; return; }
    err.textContent = "";
    var items = [].slice.call(f.querySelectorAll('input[name="items"]:checked')).map(function (i) { return i.value; });
    var d = HM.Store.load(), ts = HM.taipeiNow();
    d.bookings.push({
      id: "b" + Date.now(), created: ts.date + " " + ts.time,
      car: f.car.value.trim(), color: f.color.value.trim(), park: f.park.value, freq: f.freq.value,
      items: items, date: f.date.value, slot: f.slot.value, name: f.name.value.trim(), phone: phone,
      memo: f.memo.value.trim(), status: "待聯絡"
    });
    HM.Store.save(d);
    var toast = document.getElementById("toast");
    toast.innerHTML = "預約已送出。老闆看過後會打電話給您，確認到店時間。<br><span style='font-weight:400'>（示範版：這筆預約可以在 <a href='admin/index.html#bookings'>商家後台</a> 看到）</span>";
    toast.classList.add("show");
    ["car", "color", "name", "phone", "memo"].forEach(function (k) { f[k].value = ""; });
    f.querySelectorAll('input[name="items"]').forEach(function (i) { i.checked = false; });
  });
})();
</script>
</body>
</html>
